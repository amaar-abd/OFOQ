name: ofoq
description: "OFOQ - A modern bilingual job recruitment mobile application."

publish_to: 'none' 
version: 1.0.0+1
environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_riverpod: ^3.3.2
  easy_localization: ^3.0.7
  go_router: ^18.1.2
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4



flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/fonts/Alexandria/
    - assets/fonts/plus_jakarta_sans/

  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria/Alexandria-Bold.ttf
          weight: 700

    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700


flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utils
  filename: app_images.dart

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icons/app_icon_background.png"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
